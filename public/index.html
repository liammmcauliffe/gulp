<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Gulp</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
  <script src="/hls.js" defer></script>
  <script type="module" src="/screen.js"></script>
</head>
<body class="screen">
  <main class="tv-canvas" aria-label="Sports games" tabindex="0">
    <header class="screen-header">
      <div id="accounts" class="accounts popout is-start" data-hover hidden>
        <button class="avatar" type="button" aria-label="Profile: Liam" aria-controls="profile-panel"><svg class="fallback-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="8" r="5" fill="currentColor"/><path d="M20 21a8 8 0 1 0-16 0"/><path fill="currentColor" d="M12 13a8 8 0 0 0-8 8h16a8 8 0 0 0-8-8"/></g></svg><img src="/avatars/spider-man.png" alt="" width="56" height="56"></button>
        <div id="profile-panel" class="popout-panel" role="group" aria-labelledby="profile-title">
          <h2 id="profile-title" class="popout-title">Liam</h2>
          <div class="profiles" role="radiogroup" aria-labelledby="profile-title">
            <button class="profile" type="button" role="radio" aria-checked="true" data-profile="Liam" hidden><svg class="fallback-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="8" r="5" fill="currentColor"/><path d="M20 21a8 8 0 1 0-16 0"/><path fill="currentColor" d="M12 13a8 8 0 0 0-8 8h16a8 8 0 0 0-8-8"/></g></svg><img class="profile-picture" src="/avatars/spider-man.png" alt="" width="40" height="40">Liam</button>
            <button class="profile" type="button" role="radio" aria-checked="false" data-profile="Austin"><svg class="fallback-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="8" r="5" fill="currentColor"/><path d="M20 21a8 8 0 1 0-16 0"/><path fill="currentColor" d="M12 13a8 8 0 0 0-8 8h16a8 8 0 0 0-8-8"/></g></svg><img class="profile-picture" src="/avatars/carmen-carmy-berzatto.png" alt="" width="40" height="40">Austin</button>
            <button class="profile" type="button" role="radio" aria-checked="false" data-profile="Daniel"><svg class="fallback-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="8" r="5" fill="currentColor"/><path d="M20 21a8 8 0 1 0-16 0"/><path fill="currentColor" d="M12 13a8 8 0 0 0-8 8h16a8 8 0 0 0-8-8"/></g></svg><img class="profile-picture" src="/avatars/rotta.png" alt="" width="40" height="40">Daniel</button>
            <button class="profile" type="button" role="radio" aria-checked="false" data-profile="Patrick"><svg class="fallback-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="8" r="5" fill="currentColor"/><path d="M20 21a8 8 0 1 0-16 0"/><path fill="currentColor" d="M12 13a8 8 0 0 0-8 8h16a8 8 0 0 0-8-8"/></g></svg><img class="profile-picture" src="/avatars/woody.png" alt="" width="40" height="40">Patrick</button>
          </div>
        </div>
      </div>
      <nav class="tabs" aria-label="Main">
        <a aria-disabled="true">For You</a>
        <a aria-disabled="true">Watch</a>
        <a href="/" aria-current="page">Sports</a>
      </nav>
      <div class="header-end settings popout" data-hover>
        <button id="settings" type="button" aria-label="Settings" aria-controls="settings-panel"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" fill-rule="evenodd" d="M9.024 2.783A1 1 0 0 1 10 2h4a1 1 0 0 1 .976.783l.44 1.981q.6.285 1.14.66l1.938-.61a1 1 0 0 1 1.166.454l2 3.464a1 1 0 0 1-.19 1.237l-1.497 1.373a8 8 0 0 1 0 1.316l1.497 1.373a1 1 0 0 1 .19 1.237l-2 3.464a1 1 0 0 1-1.166.454l-1.937-.61q-.54.375-1.14.66l-.44 1.98A1 1 0 0 1 14 22h-4a1 1 0 0 1-.976-.783l-.44-1.981q-.6-.285-1.14-.66l-1.938.61a1 1 0 0 1-1.166-.454l-2-3.464a1 1 0 0 1 .19-1.237l1.497-1.373a8 8 0 0 1 0-1.316L2.53 9.97a1 1 0 0 1-.19-1.237l2-3.464a1 1 0 0 1 1.166-.454l1.937.61q.54-.375 1.14-.66l.44-1.98zM12 15a3 3 0 1 0 0-6a3 3 0 0 0 0 6" clip-rule="evenodd"/></svg></button>
        <div id="settings-panel" class="settings-panel popout-panel" role="group" aria-labelledby="settings-title">
          <h2 id="settings-title" class="popout-title">Settings</h2>
          <img id="qr" alt="QR code to connect a phone" hidden>
          <button id="prefer-direct" class="settings-switch" type="button" role="switch" aria-checked="false" aria-labelledby="prefer-direct-label" aria-describedby="prefer-direct-hint">
            <span class="settings-copy"><span id="prefer-direct-label">Use direct streams</span><span id="prefer-direct-hint">When available, instead of embeds.</span></span>
            <span class="switch-track" aria-hidden="true"></span>
          </button>
        </div>
      </div>
    </header>
    <section id="watch" aria-labelledby="watch-title" hidden>
      <video id="player" playsinline preload="metadata" crossorigin="anonymous" hidden></video>
      <p id="player-empty">No stream is available for this game right now.</p>
      <p id="player-status" role="status"></p>
      <h2 id="watch-title" class="stream-title"></h2>
      <div class="player-top">
        <button id="close-player" class="player-back" type="button" aria-label="Back"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m5 12l6-6m-6 6l6 6m-6-6h14"/></svg></button>
        <div id="watch-sources" class="player-sources popout" data-hover hidden>
          <button id="watch-sources-toggle" class="sources-toggle" type="button" aria-label="Sources" aria-controls="watch-sources-panel"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" fill-rule="evenodd" d="M2 8a3 3 0 0 1 3-3h14a3 3 0 0 1 3 3v3H2zm0 5v3a3 3 0 0 0 3 3h14a3 3 0 0 0 3-3v-3zm4-6a1 1 0 0 0 0 2h.01a1 1 0 0 0 0-2zm-1 9a1 1 0 0 1 1-1h.01a1 1 0 1 1 0 2H6a1 1 0 0 1-1-1m4-9a1 1 0 0 0 0 2h.01a1 1 0 0 0 0-2zm-1 9a1 1 0 0 1 1-1h.01a1 1 0 1 1 0 2H9a1 1 0 0 1-1-1" clip-rule="evenodd"/></svg></button>
          <div id="watch-sources-panel" class="sources-panel popout-panel" role="group" aria-label="Sources"></div>
        </div>
      </div>
      <div id="player-controls" class="player-bottom" hidden>
        <div class="timeline"><input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek" disabled><span id="playback-time">0:00 / 0:00</span></div>
        <div class="playback-controls">
          <button id="play-pause" type="button" aria-label="Play"><svg class="if-paused" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.9l10.4-6.5a1 1 0 0 0 0-1.8L9.5 4.6A1 1 0 0 0 8 5.5Z"/></svg><svg class="if-playing" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg></button>
          <button id="mute" type="button" aria-label="Unmute"><svg class="if-muted" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="stroke" d="m16 9.5 5 5m0-5-5 5"/></svg><svg class="if-sound" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="stroke" d="M15.5 9a4.5 4.5 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/></svg></button>
          <input id="volume" type="range" min="0" max="1" value="0" step="0.01" aria-label="Volume">
          <button id="go-live" type="button" hidden>Live</button>
        </div>
      </div>
      <button id="watch-pip-open" class="pip-open" type="button" aria-label="Back to full view"></button>
      <button id="watch-pip-close" class="pip-close" type="button" aria-label="Close player"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg></button>
    </section>
    <section class="schedule" aria-labelledby="sport-title">
      <h1 id="sport-title" class="visually-hidden">All</h1>
      <div id="pull" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" focusable="false" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2.2">
        <circle class="refresh-track" cx="12" cy="12" r="8.5"/>
        <circle class="refresh-arc" cx="12" cy="12" r="8.5" pathLength="100"/>
      </svg></div>
      <div id="games-status" role="status" aria-atomic="true" data-loading="true">
        <svg class="notice-spinner" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2.2"><circle class="refresh-track" cx="12" cy="12" r="8.5"/><circle class="refresh-arc" cx="12" cy="12" r="8.5" pathLength="100"/></svg>
        <div class="notice-copy"><p id="games-message">Loading games</p><p id="games-hint" hidden></p></div>
      </div>
      <div id="games" aria-label="All schedule"></div>
    </section>
    <footer class="screen-footer"><span>Gulp</span></footer>
  </main>
  <div id="embed-shell" hidden>
    <iframe id="embed-frame" title="Provider player" allow="autoplay; encrypted-media; picture-in-picture" referrerpolicy="no-referrer"></iframe>
    <div id="embed-catch" hidden></div>
    <h2 id="embed-title" class="stream-title"></h2>
    <button id="embed-back" type="button" aria-label="Back"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m5 12l6-6m-6 6l6 6m-6-6h14"/></svg></button>
    <div id="embed-sources" class="player-sources popout" data-hover hidden>
      <button id="embed-sources-toggle" class="sources-toggle" type="button" aria-label="Sources" aria-controls="embed-sources-panel"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" fill-rule="evenodd" d="M2 8a3 3 0 0 1 3-3h14a3 3 0 0 1 3 3v3H2zm0 5v3a3 3 0 0 0 3 3h14a3 3 0 0 0 3-3v-3zm4-6a1 1 0 0 0 0 2h.01a1 1 0 0 0 0-2zm-1 9a1 1 0 0 1 1-1h.01a1 1 0 1 1 0 2H6a1 1 0 0 1-1-1m4-9a1 1 0 0 0 0 2h.01a1 1 0 0 0 0-2zm-1 9a1 1 0 0 1 1-1h.01a1 1 0 1 1 0 2H9a1 1 0 0 1-1-1" clip-rule="evenodd"/></svg></button>
      <div id="embed-sources-panel" class="sources-panel popout-panel" role="group" aria-label="Sources"></div>
    </div>
    <button id="embed-pip-open" class="pip-open" type="button" aria-label="Back to full view"></button>
    <button id="embed-pip-close" class="pip-close" type="button" aria-label="Close player"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg></button>
  </div>
  <div id="dot" hidden aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" focusable="false"><path fill="currentColor" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.5 22C4.7 22 3 16.333 3 13.5V10c0-.333.2-1 1-1s1 .667 1 1v2c0 .5.3 1.5 1.5 1.5S8 12.5 8 12V3c0-.333.2-1 1-1s1 .667 1 1v7c.5.5.8 1.2 2 0V8c0-.333.2-1 1-1s1 .667 1 1v1h1c0-.333.2-1 1-1s1 .667 1 1v1h1c0-.333.2-1 1-1s1 .667 1 1v3.5c0 2.833-1.7 8.5-8.5 8.5"/></svg></div>
  <p id="error" role="alert" hidden></p>
</body>
</html>
